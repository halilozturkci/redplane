# Launcher-presence smoke spec (same contract as run_spec.smoke.yaml).
# This is not an assessment. Real attacks:
#   templates/run_spec.mcs_real.sample.yaml
#   templates/run_spec.promptfoo_dataset.sample.yaml
#   templates/run_spec.deepteam_seeded.sample.yaml
#   templates/run_spec.promptfoo_gateway.sample.yaml
#   templates/run_spec.eval_after_attack.sample.yaml
name: foundry-copilot-smoke
run_profile: nightly

metadata:
  spec_kind: smoke
  description: >-
    Launcher presence only. Not an assessment. Do not treat a completed run
    from this spec as a sign-off.

targets:
  - id: copilot-prod
    type: copilot
    endpoint: https://your-copilot-endpoint/api/chat
    auth:
      headers:
        Authorization: "Bearer <token>"
    config:
      mode: http
      skip_healthcheck: true

  - id: foundry-agent
    type: foundry
    endpoint: https://your-foundry-endpoint/api/chat
    auth:
      api_key: "<api-key>"
    config:
      skip_healthcheck: true

  - id: generic-agent
    type: http
    endpoint: http://localhost:8080/invoke
    config:
      skip_healthcheck: true
      timeout_seconds: 60
      retry_attempts: 2
      retry_backoff_seconds: 1.0
      retry_on_status: [429, 500, 502, 503, 504]

engines:
  - name: pyrit
    params:
      # Presence only. Real attacks: templates/run_spec.mcs_real.sample.yaml
      command: "python -c \"import pyrit; print('pyrit-ok')\""

  - name: promptfoo
    params:
      command: "promptfoo --version"

  - name: garak
    params:
      command: "uvx --from garak==0.17.0 garak --version"

  - name: powerpwn
    params:
      mode: recon-only
      command: "uvx --from powerpwn==6.0.0 powerpwn --help"

  - name: powercat
    params:
      # No public npm CLI. Local launcher from the Copilot Studio Kit:
      # https://github.com/microsoft/Power-CAT-Copilot-Studio-Kit
      command: "copilot-studio-kit agent-review run"

  - name: deepteam
    params:
      command: "uvx --from deepteam==1.0.9 --with sentry-sdk deepteam --help"
      require_test_cases: true

  - name: inspect
    params:
      command: "uvx --from inspect-ai==0.3.263 inspect --help"

  - name: giskard
    params:
      command: >-
        uvx --python 3.12 --from 'giskard[scan]==3.0.0' python -c "from giskard.scan import vulnerability_scan; print('giskard-scan-ok')"

evaluators:
  - name: deepeval
    metrics: [answer_relevancy, faithfulness, toxicity]
    params:
      threshold: 0.5
      command: "uvx --from deepeval==4.2.2 deepeval --help"
    fail_open: true

  - name: promptfoo_eval
    params:
      command: "promptfoo --version"
      threshold: 0.5
    fail_open: true

  - name: azure_ai_eval
    params:
      command: "python --version"
      threshold: 0.5
    fail_open: true

  - name: giskard_eval
    metrics: [hallucination, toxicity, robustness]
    params:
      command: >-
        uvx --python 3.12 --from 'giskard[scan]==3.0.0' python -c "from giskard.scan import vulnerability_scan; print('giskard-scan-ok')"
    fail_open: true

  - name: inspect_eval
    params:
      command: "inspect --help"
      threshold: 0.5
    fail_open: true

  - name: custom_script
    params:
      command: "python --version"
      threshold: 0.5
    fail_open: true

policy_profiles:
  - owasp_llm
  - owasp_agentic
  - mitre_atlas

budget:
  max_duration_seconds: 3600

timeouts:
  connect_seconds: 10
  request_seconds: 60
  engine_seconds: 1800

evidence_level: standard
seed: 42
