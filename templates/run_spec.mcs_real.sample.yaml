# Real MCS PyRIT scan. Target config does not feed the PyRIT subprocess.
# PyRIT reads ${TENANT_ID}, ${APP_CLIENT_ID}, ${ENVIRONMENT_ID}, and
# ${AGENT_IDENTIFIER} from the process environment into mcs_agent_callback.json.
name: mcs-real-redteam
run_profile: nightly

targets:
  - id: mcs-agent
    type: copilot
    config:
      mode: sdk
      skip_healthcheck: true
      sdk_path: src/urt/integrations/mcs_pyrit/copilot_client.py
      tenant_id: "${TENANT_ID}"
      app_client_id: "${APP_CLIENT_ID}"
      environment_id: "${ENVIRONMENT_ID}"
      agent_identifier: "${AGENT_IDENTIFIER}"

engines:
  - name: pyrit
    params:
      script_path: src/urt/integrations/mcs_pyrit/red_team_scan.py
      config_path: src/urt/integrations/mcs_pyrit/config/mcs_agent_callback.json
      working_dir: .

policy_profiles:
  - owasp_llm
  - owasp_agentic
  - mitre_atlas

budget:
  max_duration_seconds: 3600

timeouts:
  connect_seconds: 10
  request_seconds: 60
  engine_seconds: 1800

evidence_level: standard
seed: 42
