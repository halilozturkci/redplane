[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "redplane"
version = "0.1.0"
description = "Attack and evaluation control plane for AI systems"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
  {name = "Redplane contributors"}
]
keywords = ["ai", "red-team", "evaluation", "llm", "security", "audit"]
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn>=0.30.0",
  "PyYAML>=6.0.0",
  "azure-ai-evaluation>=1.18.0",
  "azure-identity>=1.15.0",
  "openai>=3,<4",
  "pyrit>=1.1,<2",
  "python-dotenv>=1.0.0",
  "msal>=1.20.0",
  "msal-extensions>=1.0.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0"
]
mcs = [
  "microsoft-agents-copilotstudio-client==1.5.0"
]

[project.scripts]
urt = "urt.cli:main"

[project.urls]
Homepage = "https://github.com/halilozturkci/redplane"
Issues = "https://github.com/halilozturkci/redplane/issues"
Source = "https://github.com/halilozturkci/redplane"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
