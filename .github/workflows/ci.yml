name: ci

"on":
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22.22.0"
      - name: Assert Node floor
        run: bash -c 'source scripts/require_node.sh && require_urt_node'
      - name: Check lockfile
        run: uv lock --check
      - name: Install runtime and pytest
        run: uv sync --extra dev --frozen
      - name: Unit tests
        run: uv run pytest
      - name: CLI smoke
        run: uv run urt --help
